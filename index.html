<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zone 5 Running Lab</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Монохромний світ Zone 5: доріжка стадіону, смугаста «5», градації чорного й білого */
:root {
  --bg: #f6f6f7; --surface: #ffffff; --raise: #ececee; --line: #d0d0d2; --muted: #66666b; --text: #101010; --ink: #101010; --on-ink: #f6f6f7;
  --z1: #d6d6d8; --z2: #a9a9ad; --z3: #7a7a7f; --z4: #48484c; --z5: #101010;
  --z1t: #101010; --z2t: #101010; --z3t: #fff; --z4t: #fff; --z5t: #fff;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 18px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0a0a0b; --surface: #141416; --raise: #1d1d20; --line: #2c2c30; --muted: #9a9aa0; --text: #f6f6f7; --ink: #f6f6f7; --on-ink: #0a0a0b;
  --z1: #3a3a3e; --z2: #606064; --z3: #9e9e9e; --z4: #d0d0d0; --z5: #f6f6f7;
  --z1t: #f6f6f7; --z2t: #f6f6f7; --z3t: #101010; --z4t: #101010; --z5t: #101010;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top img { height: 34px; width: auto; display: block; }
:root:not([data-theme="dark"]) .top img, :root:not([data-theme="dark"]) .logo-big { filter: invert(1); }
.top .wm { font: 800 15px/1 var(--display); letter-spacing: .06em; }
.top .wm small { display: block; font: 600 11px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.flag { margin-left: auto; width: 20px; height: 13px; border-radius: 2px; background: linear-gradient(#2f6fd6 50%, #f5c400 50%); }

main { max-width: 640px; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; }

.hero { position: relative; overflow: hidden; border-radius: var(--r); background: linear-gradient(160deg, #1b1b1e 0%, #050505 70%); color: #f6f6f7; padding: 22px 20px; min-height: 168px; display: flex; align-items: flex-end; isolation: isolate; }
.hero::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 9px); -webkit-mask: linear-gradient(#000, transparent 75%); mask: linear-gradient(#000, transparent 75%); z-index: -1; }
.hero .trk { position: absolute; right: -70px; top: -20px; width: 340px; height: 210px; color: rgba(255,255,255,.16); z-index: -1; }
.hero-in { position: relative; width: 100%; }
.eyebrow { margin: 0 0 4px; font: 600 11px/1.2 var(--body); letter-spacing: .16em; text-transform: uppercase; color: #a9a9ad; }
.big { font: 800 52px/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font: 600 14px var(--body); margin-left: 6px; letter-spacing: .04em; color: #a9a9ad; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 12px; }
.stats span, .paces span, .kv span, .out span, .lres span, .integ span { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hero .stats span { color: #a9a9ad; }
.stats b { font: 700 16px/1.3 var(--display); font-variant-numeric: tabular-nums; }
.sub { margin: 2px 0 10px; color: var(--muted); font-size: 13px; }
.sub.light { color: #a9a9ad; margin: 8px 0 0; }
.prof { min-height: 210px; justify-content: center; align-items: center; text-align: center; }
.prof .trk { right: 50%; transform: translateX(50%); width: 420px; height: 250px; top: -20px; color: rgba(255,255,255,.1); }
.logo-big { height: 130px; display: block; margin: 0 auto 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { margin: 0; font: 700 13px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.card .sub { margin: -6px 0 0; }
details.card summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
details.card summary::after { content: "+"; font: 700 18px var(--display); color: var(--muted); }
details[open].card summary::after { content: "−"; }
details.card summary::-webkit-details-marker { display: none; }
.sec { display: flex; align-items: center; gap: 10px; margin: 10px 2px 0; font: 700 14px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.stripes { display: inline-flex; gap: 2px; height: 14px; }
.stripes i { width: 2px; background: currentColor; display: block; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld span { font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fld input, .lr input { width: 100%; background: var(--raise); border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; font: 600 16px var(--body); font-variant-numeric: tabular-nums; }
.fld input:focus, .lr input:focus { border-color: var(--ink); outline: none; }
.fld input:disabled { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.fld input::placeholder, .lr input::placeholder { color: var(--muted); opacity: .7; font-weight: 500; }
.out { background: var(--raise); border-radius: 12px; padding: 9px 12px; display: flex; flex-direction: column; justify-content: center; }
.out b { font: 700 20px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.out b small { font: 500 12px var(--body); color: var(--muted); margin-left: 3px; }
.out b.sm2 { font-size: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 13px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chips.seg { flex-wrap: nowrap; background: var(--raise); border-radius: 14px; padding: 4px; gap: 4px; }
.chips.seg .chip { flex: 1; border: 0; border-radius: 10px; padding: 9px 6px; font-size: 13px; }

.paces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.paces div { background: var(--surface); padding: 10px 12px; }
.paces div:first-child { grid-column: 1 / -1; }
.paces b { font: 700 18px/1.3 var(--display); font-variant-numeric: tabular-nums; }
.about { margin: 0; color: var(--muted); font-size: 14px; }

.sessions { display: flex; flex-direction: column; gap: 10px; }
.sess { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 14px 20px; overflow: hidden; }
.sess::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(180deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .5; }
.sess header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sess h4 { margin: 0; font: 600 15px/1.3 var(--body); }
.struct { margin: 2px 0 0; font: 800 22px/1.15 var(--display); letter-spacing: -.01em; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 14px; margin-top: 12px; }
.kv b { font: 700 15px/1.3 var(--display); font-variant-numeric: tabular-nums; }
.kv b.sm { font: 600 13px/1.35 var(--body); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; font-weight: 600; border: 1px dashed var(--muted); border-radius: 999px; padding: 3px 9px; }
.note2 { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.zp { flex: none; font: 700 11px/1 var(--display); padding: 6px 8px; border-radius: 8px; }
.z1 { background: var(--z1); color: var(--z1t); } .z2 { background: var(--z2); color: var(--z2t); } .z3 { background: var(--z3); color: var(--z3t); } .z4 { background: var(--z4); color: var(--z4t); } .z5 { background: var(--z5); color: var(--z5t); }

.split { display: flex; gap: 4px; }
.split div { padding: 9px 10px; border-radius: 10px; background: var(--z2); color: var(--z2t); min-width: 0; }
.split div + div { background: var(--z5); color: var(--z5t); }
.split span { display: block; font-size: 11px; opacity: .8; } .split b { font-size: 13px; white-space: nowrap; }

.zones { display: flex; flex-direction: column; gap: 12px; }
.zrow { display: grid; grid-template-columns: 116px 1fr; grid-template-areas: "lab val" "bar bar"; gap: 6px 10px; align-items: center; }
.zlab { grid-area: lab; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.zval { grid-area: val; text-align: right; }
.zval b { font: 700 16px var(--display); font-variant-numeric: tabular-nums; }
.zval span { display: block; font-size: 12px; color: var(--muted); }
.zbar { grid-area: bar; height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.zbar i { display: block; height: 100%; border-radius: 4px; }
.mz { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.mzr { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; align-items: end; }
.mzr .zp { margin-bottom: 12px; text-align: center; }
.maf { margin: 0; font-size: 13px; color: var(--muted); } .maf b { color: var(--text); }

.tbl { display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: 1.3fr 1fr 1fr .8fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; align-items: center; font-size: 14px; }
.tr:last-child { border-bottom: 0; }
.tr.th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 0; }
.tbl.two .tr { grid-template-columns: 1fr 1fr; }
.mut { color: var(--muted); }

.lrows { display: flex; flex-direction: column; gap: 6px; }
.lr { display: grid; grid-template-columns: 1fr 1fr 1fr 34px; gap: 6px; align-items: center; }
.lr.th span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lr input { padding: 9px 10px; font-size: 15px; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; height: 38px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--muted); stroke-dasharray: 3 4; stroke-width: 1; }
.chart .band { fill: var(--ink); opacity: .08; }
.chart .lal { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.chart .hrl { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 3; }
.chart .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
.chart .mk { stroke: var(--ink); stroke-width: 1; opacity: .6; }
.chart .ax, .chart .mkl { fill: var(--muted); font: 600 10px var(--body); }
.chart .mkl { fill: var(--text); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.lg { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid var(--ink); vertical-align: middle; margin-right: 5px; }
.lg.hr { border-top: 1.5px dashed var(--muted); } .lg.bd { height: 10px; border: 0; background: var(--ink); opacity: .15; }
.lres { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lres div { background: var(--raise); border-radius: 12px; padding: 10px 12px; }
.lres b { display: block; font: 700 20px/1.3 var(--display); font-variant-numeric: tabular-nums; }
.lres b small { font: 500 12px var(--body); color: var(--muted); margin-left: 2px; }
.lres em { font-style: normal; font-size: 12px; color: var(--muted); }

.btn { display: inline-flex; justify-content: center; align-items: center; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row .btn { flex: 1; }
.note { border: 1px dashed var(--muted); border-radius: 14px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.note b, .note a { color: var(--text); }
.foot { margin: 4px 2px; font-size: 12px; color: var(--muted); }
.empty { align-items: flex-start; }
.integ { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.integ:last-of-type { border-bottom: 0; }
.integ b { display: block; font-weight: 700; }
.integ span { text-transform: none; letter-spacing: 0; font-size: 12px; }
.integ .soon { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--muted); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(6, 1fr); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 10.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button.on { color: var(--text); }
.ti { width: 22px; height: 16px; border-radius: 8px; border: 1.5px solid currentColor; position: relative; }
.ti::after { content: ""; position: absolute; inset: 3px; border-radius: 5px; border: 1.5px solid currentColor; opacity: .5; }
.tabs button.on .ti { background: currentColor; }
.tabs button.on .ti::after { border-color: var(--bg); opacity: 1; }
#ttl { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn, .tabs button { transition: background .15s, color .15s; } }

/* план */
.lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: -4px; }
.fld input[type="date"] { min-height: 46px; -webkit-appearance: none; appearance: none; }
.big.sm { font-size: 30px; line-height: 1.1; }
.big.sm small { display: block; margin: 6px 0 0; font: 800 22px var(--display); color: #f6f6f7; letter-spacing: 0; }
.pchart { width: 100%; height: auto; display: block; }
.pchart .ax { fill: var(--muted); font: 600 9px var(--body); }
.pb.z2 { fill: var(--z2); } .pb.z3 { fill: var(--z3); } .pb.z4 { fill: var(--z4); } .pb.z5 { fill: var(--z5); }
.pb.cur { stroke: var(--ink); stroke-width: 2; }
.phs { display: flex; flex-direction: column; gap: 6px; }
.ph { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
.ph i { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
.ph span { color: var(--muted); font-size: 12px; }
.wk { gap: 10px; }
.wk.now { border-color: var(--ink); }
.wk summary { gap: 10px; }
.wk summary > div:first-child { min-width: 0; }
.wk summary .sub { margin: 3px 0 0; }
.wkm { margin-left: auto; text-align: right; }
.wkm b { display: block; font: 700 20px/1 var(--display); }
.wkm span { font-size: 11px; color: var(--muted); }
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 28px 1fr auto 30px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.day.rest { grid-template-columns: 28px 1fr; color: var(--muted); }
.day.rest b { font-weight: 500; }
.dw { font: 700 11px var(--display); color: var(--muted); }
.dt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dt b { font-size: 14px; font-weight: 600; }
.dt b em { font: normal 800 14px var(--display); }
.dt span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dt .dn { font-style: italic; }
.day.race .dt b { font: 800 15px var(--display); }
.day.done .dt { opacity: .45; }
.day.done .dt b { text-decoration: line-through; }
.chk { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; cursor: pointer; position: relative; padding: 0; }
.chk.on { background: var(--ink); border-color: var(--ink); }
.chk.on::after { content: ""; position: absolute; left: 9px; top: 5px; width: 6px; height: 11px; border: solid var(--on-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
/* strava */
.err { margin: 0; font-size: 13px; font-weight: 600; }
.soon.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.tr.s3 { grid-template-columns: 1.3fr 1fr 1fr; }
.tr.s4 { grid-template-columns: 1.25fr 1fr 1fr .8fr; }
.bc { display: flex; flex-direction: column; line-height: 1.2; }
.bc em { font-style: normal; font-size: 11px; color: var(--muted); }
.runs { display: flex; flex-direction: column; }
.run { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.run > div { flex: 1; min-width: 0; }
.run b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run > div span { font-size: 12px; color: var(--muted); }
#view > .chips.seg { margin-bottom: 0; }
</style>

<script>
// ===== Zone 5 — розрахунки =====
const DIST = {
  '1500': { km: 1.5, name: '1500 м', short: '1500' },
  '3k':   { km: 3, name: '3 км', short: '3K' },
  '5k':   { km: 5, name: '5 км', short: '5K' },
  '10k':  { km: 10, name: '10 км', short: '10K' },
  'hm':   { km: 21.0975, name: 'Півмарафон', short: '21.1' },
  'm':    { km: 42.195, name: 'Марафон', short: '42.2' },
};
const DKEYS = Object.keys(DIST);

function parseTime(str) {
  if (str == null) return NaN;
  str = String(str).trim().replace(',', '.');
  if (!str) return NaN;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return NaN;
  let s = 0;
  for (const p of parts) s = s * 60 + p;
  return s;
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtTime(sec, forceH) {
  if (!isFinite(sec) || sec <= 0) return '—';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h || forceH) ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function fmtSplit(sec) { // short reps: 1:23.4 or 58.2
  if (!isFinite(sec) || sec <= 0) return '—';
  if (sec < 60) return sec.toFixed(1);
  if (sec >= 120) return fmtTime(sec);
  const m = Math.floor(sec / 60), s = sec - m * 60;
  return `${m}:${s < 10 ? '0' : ''}${s.toFixed(sec >= 600 ? 0 : 1)}`.replace(/\.0$/, '');
}
const fmtPace = (spk) => fmtTime(spk);

// --- Jack Daniels VDOT ---
function vo2At(v) { return -4.60 + 0.182258 * v + 0.000104 * v * v; } // v у м/хв
function pctMax(tMin) { return 0.8 + 0.1894393 * Math.exp(-0.012778 * tMin) + 0.2989558 * Math.exp(-0.1932605 * tMin); }
function vdotFrom(km, sec) {
  const tMin = sec / 60, v = km * 1000 / tMin;
  return vo2At(v) / pctMax(tMin);
}
function predictTime(vdot, km) {
  let lo = 60, hi = 8 * 3600;
  for (let i = 0; i < 80; i++) {
    const mid = (lo + hi) / 2;
    if (vdotFrom(km, mid) > vdot) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function paceAtVO2(vo2) { // с/км
  const a = 0.000104, b = 0.182258, c = -4.60 - vo2;
  const v = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
  return 60000 / v;
}
function riegel(km1, sec1, km2, k = 1.06) { return sec1 * Math.pow(km2 / km1, k); }

// Тренувальні темпи за Деніелсом
function danielsPaces(vdot) {
  const I = paceAtVO2(vdot * 0.975);
  return {
    eFast: paceAtVO2(vdot * 0.74),
    eSlow: paceAtVO2(vdot * 0.62),
    m: predictTime(vdot, 42.195) / 42.195,
    t: paceAtVO2(vdot * 0.88),
    i: I,
    r: I - 15, // ≈ −6 с на 400 м
  };
}

// Повний набір темпів для приладдя
function buildPaces(profile) {
  const best = bestVdot(profile.pbs);
  const vdot = best ? best.vdot : null;
  if (!vdot) return null;
  const dp = danielsPaces(vdot);
  const race = {};
  for (const k of DKEYS) race[k] = predictTime(vdot, DIST[k].km) / DIST[k].km;
  race['15k'] = predictTime(vdot, 15) / 15;
  const tk = profile.target || '10k';
  const goalSec = parseTime(profile.targetTime);
  const goalPace = isFinite(goalSec) && goalSec > 0 ? goalSec / DIST[tk].km : null;
  const rp = goalPace || race[tk];
  return { vdot, best, ...dp, race, target: tk, rp, goalPace, recSlow: dp.eSlow + 40, recFast: dp.eSlow + 15 };
}

function bestVdot(pbs) {
  let best = null;
  for (const k of DKEYS) {
    const s = parseTime(pbs && pbs[k]);
    if (!isFinite(s) || s <= 0) continue;
    const v = vdotFrom(DIST[k].km, s);
    if (v > 15 && v < 90 && (!best || v > best.vdot)) best = { vdot: v, key: k, sec: s };
  }
  return best;
}

// ===== Методики інтервалів =====
// Кожна сесія: {title, reps, dist (м) або dur (хв), pace | [повільний, швидкий], rest, zone, note}
const METHODS = [
  { id: 'daniels', name: 'Деніелс (VDOT)', about: 'Темпи E / M / T / I / R з вашого найкращого результату. Класика «Running Formula».' },
  { id: 'norway', name: 'Норвезька модель', about: 'Підпорогові інтервали з контролем лактату 2–3,5 ммоль. Подвійний поріг (Інгебрігтсени) і «singles» для аматорів.' },
  { id: 'pfitz', name: 'Пфітцінгер', about: 'Пороговий темпо-біг (LT) і VO₂max-інтервали. Основа планів «Advanced Marathoning».' },
  { id: 'canova', name: 'Канова', about: 'Відсотки від цільового темпу: екстенсивні, інтенсивні та специфічні блоки навколо змагального темпу.' },
  { id: 'hudson', name: 'Хадсон', about: 'Адаптивне тренування: від загальної швидкості до специфічних відрізків у темпі цільової дистанції.' },
  { id: 'seiler', name: '80/20 (Сейлер)', about: '80 % часу легко, 20 % — інтенсивно. Класичні 4×8 хв і 5×4 хв.' },
  { id: 'yasso', name: 'Ясо 800', about: '10 × 800 м: час відрізка в хв:с = цільовий час марафону в год:хв.' },
];

function sessionsFor(method, P) {
  const tk = P.target, rp = P.rp;
  const isLong = tk === 'hm' || tk === 'm';
  const L = [];
  const add = (o) => L.push(o);
  switch (method) {
    case 'daniels':
      add({ title: 'I — інтервали VO₂max', reps: tk === 'm' ? 5 : 6, dist: 1000, pace: P.i, rest: '3 хв підтюпцем', zone: 5, note: 'Робочий відрізок до 5 хв, сумарно ≤ 8 % тижневого обсягу.' });
      add({ title: 'T — крейсерські інтервали', reps: isLong ? 5 : 4, dist: 1600, pace: P.t, rest: '1 хв', zone: 4, note: 'Комфортно важко. Сумарно ≤ 10 % тижневого обсягу.' });
      add({ title: 'T — темпо-біг', reps: 1, dur: 20, pace: P.t, rest: '—', zone: 4, note: 'Безперервно 20 хв на пороговому темпі.' });
      if (isLong) add({ title: 'M — марафонський темп', reps: 1, dist: tk === 'm' ? 16000 : 10000, pace: P.m, rest: '—', zone: 3, note: 'Всередині довгої пробіжки або окремо.' });
      add({ title: 'R — повторення', reps: isLong ? 6 : 8, dist: isLong ? 200 : 400, pace: P.r, rest: isLong ? '200 м підтюпцем' : '400 м підтюпцем', zone: 5, note: 'Швидкість і економічність. Повне відновлення.' });
      break;
    case 'norway': {
      const sub = [P.t + 10, P.t + 4];
      add({ title: 'Подвійний поріг · ранок', reps: 5, dist: 2000, pace: [P.t + 12, P.t + 6], rest: '1 хв', zone: 4, lact: '2,0–3,0', note: 'Лактат 2–3 ммоль. Контроль після 2-го та останнього відрізка.' });
      add({ title: 'Подвійний поріг · вечір', reps: 10, dist: 1000, pace: sub, rest: '1 хв', zone: 4, lact: '2,5–3,5', note: 'Той самий день, через 5–6 год. Не перевищувати 3,5–4 ммоль.' });
      add({ title: 'Singles · вівторок', reps: 10, dist: 1000, pace: [P.race.hm, P.race['15k']], rest: '1 хв', zone: 4, lact: '≈2,5–3,0', note: 'Норвезькі «singles» для аматорів: один поріг за день, 3 рази на тиждень.' });
      add({ title: 'Singles · четвер', reps: 5, dur: 6, pace: [P.race['15k'], P.race['10k']], rest: '1 хв', zone: 4, lact: '≈3,0–3,5', note: 'Відрізки за часом. Пульс до LT2 − 5 уд/хв.' });
      add({ title: 'Singles · субота', reps: 20, dist: 400, pace: [P.race['10k'] + 2, P.race['10k'] - 3], rest: '30 с', zone: 4, lact: '≈3,5', note: 'Короткі відрізки на верхній межі порогу.' });
      add({ title: 'Пагорби (Х-елемент)', reps: 10, dur: 1, pace: null, rest: 'спуск підтюпцем', zone: 5, note: '1 хв угору, зусилля 5K. Раз на 1–2 тижні, решта днів — легко (< LT1).' });
      break;
    }
    case 'pfitz':
      add({ title: 'LT — пороговий темпо-біг', reps: 1, dur: isLong ? 32 : 24, pace: [P.race.hm, P.race['15k']], rest: '—', zone: 4, note: 'Темп 15 км – півмарафону. Посередині середньої пробіжки.' });
      add({ title: 'LT — інтервали', reps: 2, dist: isLong ? 5000 : 3000, pace: [P.race.hm, P.race['15k']], rest: '3 хв', zone: 4, note: '' });
      add({ title: 'VO₂max', reps: 5, dist: 1200, pace: P.race['5k'], rest: '50–90 % часу відрізка', zone: 5, note: 'Темп 5 км. У марафонських планах — у фазі загострення.' });
      if (isLong) add({ title: 'MP-пробіжка', reps: 1, dist: tk === 'm' ? 19000 : 12000, pace: tk === 'm' ? rp : P.m, rest: '—', zone: 3, note: 'Всередині 25–29 км пробіжки, у марафонському темпі.' });
      add({ title: 'Швидкісні ролики', reps: 10, dist: 100, pace: P.r, rest: 'повне', zone: 5, note: 'Після легкої пробіжки, 1–2 рази на тиждень.' });
      break;
    case 'canova': {
      const pctP = (p) => rp / p; // p — % швидкості змагального темпу
      add({ title: 'Екстенсивні інтервали', reps: isLong ? 4 : 5, dist: isLong ? 3000 : 2000, pace: [pctP(0.95), pctP(0.97)], rest: '1 хв', zone: 3, pct: '95–97 %', note: 'Загальна аеробна база навколо змагального темпу.' });
      add({ title: 'Інтенсивні інтервали', reps: 8, dist: 1000, pace: [pctP(1.03), pctP(1.05)], rest: '2 хв', zone: 5, pct: '103–105 %', note: 'Швидше за цільовий темп, щоб він став комфортним.' });
      const spec = { '1500': [6, 400], '3k': [5, 800], '5k': [3, 2000], '10k': [3, 3000], 'hm': [3, 5000], 'm': [2, 10000] }[tk];
      add({ title: 'Специфічне тренування', reps: spec[0], dist: spec[1], pace: [pctP(0.99), pctP(1.01)], rest: isLong ? '3–4 хв' : '2–3 хв', zone: 4, pct: '99–101 %', note: 'Ключова сесія останніх 6–8 тижнів.' });
      if (tk === 'm') add({ title: 'Довга специфічна', reps: 1, dist: 30000, pace: [pctP(0.95), pctP(0.98)], rest: '—', zone: 3, pct: '95–98 %', note: 'Фінальні 10 км — 100 %. За 4–6 тижнів до старту.' });
      if (tk === 'hm') add({ title: 'Довга специфічна', reps: 1, dist: 18000, pace: [pctP(0.95), pctP(0.98)], rest: '—', zone: 3, pct: '95–98 %', note: '' });
      break;
    }
    case 'hudson': {
      const spec = { '1500': [8, 400], '3k': [6, 600], '5k': [6, 800], '10k': [5, 1600], 'hm': [3, 3000], 'm': [2, 6000] }[tk];
      add({ title: 'Загальна швидкість', reps: 4, dist: 1000, pace: P.race['5k'], rest: '2 хв', zone: 5, note: 'Ранній етап. Темп 5 км.' });
      add({ title: 'Спринти в гору', reps: 8, dur: 0.17, pace: null, rest: 'повне', zone: 5, note: '10 с максимально вгору. Нервово-м’язова сила.' });
      add({ title: 'Специфічні відрізки', reps: spec[0], dist: spec[1], pace: rp, rest: isLong ? '3 хв' : '2 хв', zone: tk === 'm' ? 3 : 4, note: 'Темп цільової дистанції. Кількість зростає до старту.' });
      add({ title: 'Поріг із прогресією', reps: 1, dur: 25, pace: [P.t + 8, P.t - 2], rest: '—', zone: 4, note: 'Від трохи повільніше порогу до порогу.' });
      break;
    }
    case 'seiler':
      add({ title: '4 × 8 хв', reps: 4, dur: 8, pace: [P.t, P.race['10k']], rest: '2 хв', zone: 4, note: 'Найефективніший протокол у дослідженні Сейлера (2013).' });
      add({ title: '5 × 4 хв', reps: 5, dur: 4, pace: P.i, rest: '2–3 хв', zone: 5, note: 'VO₂max. Остання хвилина відрізка — найважча.' });
      add({ title: '3 × 12 хв', reps: 3, dur: 12, pace: [P.t + 5, P.t], rest: '2 хв', zone: 4, note: 'Поріг. Для HM / марафону.' });
      break;
    case 'yasso': {
      const mSec = tk === 'm' && P.goalPace ? P.goalPace * 42.195 : predictTime(P.vdot, 42.195);
      const rep = mSec / 60; // години → хвилини
      add({ title: 'Ясо 800', reps: 10, dist: 800, pace: rep / 0.8, rest: 'підтюпцем той самий час', zone: 5, note: `Цільовий марафон ${fmtTime(mSec, true)} → 800 м за ${fmtTime(rep)}. Почніть з 4 повторів, додавайте по 1 на тиждень.` });
      break;
    }
  }
  return L;
}

// ===== Довгі та відновлювальні =====
function longRecs(P, profile) {
  const tk = P.target, wk = Number(profile.weeklyKm) || 40;
  const share = { '1500': [0.18, 0.22], '3k': [0.18, 0.22], '5k': [0.2, 0.25], '10k': [0.22, 0.27], 'hm': [0.25, 0.3], 'm': [0.28, 0.33] }[tk];
  const cap = { '1500': 16, '3k': 18, '5k': 20, '10k': 24, 'hm': 26, 'm': 35 }[tk];
  const capMin = tk === 'm' ? 180 : 150;
  let kmLo = Math.min(cap, wk * share[0]), kmHi = Math.min(cap, wk * share[1]);
  const midPace = (P.eSlow + P.eFast) / 2;
  const capKm = capMin * 60 / midPace;
  kmLo = Math.min(kmLo, capKm); kmHi = Math.min(kmHi, capKm);
  const z = hrZones(profile);
  const z2 = z ? z.zones[1] : null, z1 = z ? z.zones[0] : null;
  const maf = profile.age ? 180 - Number(profile.age) : null;
  const L = [];
  L.push({ title: 'Базова довга', km: [kmLo, kmHi], pace: [P.eSlow, P.eFast], hr: z2 ? `до ${z2.hi} уд/хв (Z2)` : null, note: `${Math.round(share[0] * 100)}–${Math.round(share[1] * 100)} % тижневого обсягу (${wk} км), не довше ${capMin} хв. Розмовний темп.` });
  L.push({ title: 'Прогресивна', km: [kmLo, kmHi], pace: [P.eSlow, P.m], hr: null, note: 'Перші 2/3 — легко, далі кожні 3–5 км швидше, фініш у марафонському темпі.' });
  if (tk === 'hm' || tk === 'm') {
    const fin = tk === 'm' ? [8, 16] : [5, 8];
    L.push({ title: 'Зі специфічним фінішем', km: [kmLo, kmHi], pace: [P.eFast, P.rp], hr: null, note: `Останні ${fin[0]}–${fin[1]} км у цільовому темпі (Хадсон / Канова / Пфітцінгер).` });
  }
  L.push({ title: 'Норвезька легка', km: [kmLo * 0.85, kmHi * 0.9], pace: [P.eSlow + 10, P.eSlow - 5], hr: profile.lt1Hr ? `до ${Math.round(profile.lt1Hr) - 5} уд/хв (< LT1)` : null, lact: '< 2,0', note: 'Лактат нижче 2 ммоль увесь час. Краще повільніше, ніж зірвати наступний пороговий день.' });
  if (maf) L.push({ title: 'За Маффетоном', km: [kmLo, kmHi], pace: null, hr: `${maf - 10}–${maf} уд/хв`, note: `MAF = 180 − вік. Темп — який вийде при цьому пульсі. Його ріст = прогрес бази.` });
  const rec = [];
  rec.push({ title: 'Відновлювальна', dur: [30, 45], pace: [P.recSlow, P.recFast], hr: z1 ? `до ${z1.hi} уд/хв (Z1)` : null, note: 'Наступного дня після інтервалів або довгої. Без годинника на темп — тільки пульс.' });
  rec.push({ title: 'Подвійна легка (норвезька)', dur: [25, 35], pace: [P.recSlow + 10, P.recFast], hr: profile.lt1Hr ? `до ${Math.round(profile.lt1Hr) - 15} уд/хв` : null, note: 'Друга коротка пробіжка дня замість однієї довшої — менше ударного навантаження.' });
  rec.push({ title: 'Легка + розкатки', dur: [35, 50], pace: [P.eSlow, P.eFast], hr: z2 ? `до ${z2.hi} уд/хв` : null, note: 'Наприкінці 6 × 20 с розкаток з повним відпочинком. За 1–2 дні до інтервалів.' });
  return { long: L, rec, wk };
}

// ===== Пульсові зони =====
const ZONE_NAMES = ['Відновлення', 'Аеробна', 'Темпова', 'Порогова', 'VO₂max'];
function hrZones(profile, methodOverride) {
  const method = methodOverride || profile.zoneMethod || 'karvonen';
  const max = Number(profile.hrMax), rest = Number(profile.hrRest), lthr = Number(profile.lthr);
  let zones = null, lact = null;
  const mk = (arr) => arr.map(([lo, hi], i) => ({ lo: Math.round(lo), hi: Math.round(hi), name: ZONE_NAMES[i] }));
  if (method === 'max' && max) {
    zones = mk([[.5, .6], [.6, .7], [.7, .8], [.8, .9], [.9, 1]].map(([a, b]) => [a * max, b * max]));
  } else if (method === 'karvonen' && max && rest) {
    const r = max - rest;
    zones = mk([[.5, .6], [.6, .7], [.7, .8], [.8, .9], [.9, 1]].map(([a, b]) => [rest + a * r, rest + b * r]));
  } else if (method === 'lthr' && lthr) {
    zones = mk([[.65, .85], [.85, .89], [.9, .94], [.95, .99], [1, 1.06]].map(([a, b]) => [a * lthr, b * lthr]));
  } else if (method === 'olympia' && max) {
    zones = mk([[.55, .72], [.72, .82], [.82, .87], [.87, .92], [.92, .97]].map(([a, b]) => [a * max, b * max]));
    lact = ['0,8–1,5', '1,5–2,5', '2,5–4,0', '4,0–6,0', '6,0–10'];
  } else if (method === 'lactate' && profile.lt1Hr && profile.lt2Hr) {
    const l1 = Number(profile.lt1Hr), l2 = Number(profile.lt2Hr), mx = max || l2 + 15;
    zones = mk([[l1 - 25, l1 - 10], [l1 - 10, l1], [l1, l2 - 5], [l2 - 5, l2 + 2], [l2 + 2, mx]]);
    lact = ['< 1,5', '1,5–2,0', '2,0–3,5', '3,5–4,5', '> 4,5'];
  } else if (method === 'manual' && profile.manualZones) {
    zones = profile.manualZones.map((z, i) => ({ lo: Number(z.lo), hi: Number(z.hi), name: ZONE_NAMES[i] }));
  }
  return zones ? { method, zones, lact } : null;
}

// ===== Лактат =====
function lactateAnalysis(rows) {
  const pts = rows.map(r => ({ pace: parseTime(r.pace), hr: Number(r.hr), la: Number(String(r.la).replace(',', '.')) }))
    .filter(p => isFinite(p.pace) && p.pace > 0 && isFinite(p.la) && p.la > 0)
    .sort((a, b) => b.pace - a.pace); // від повільного до швидкого
  if (pts.length < 2) return { pts, lt1: null, lt2: null, base: null };
  const base = Math.min(...pts.map(p => p.la));
  const at = (target) => {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (a.la <= target && b.la >= target) {
        const f = (target - a.la) / (b.la - a.la || 1);
        const sa = 1000 / a.pace, sb = 1000 / b.pace; // м/с
        const s = sa + f * (sb - sa);
        const hr = a.hr && b.hr ? a.hr + f * (b.hr - a.hr) : null;
        return { pace: 1000 / s, hr: hr ? Math.round(hr) : null, la: target };
      }
    }
    return null;
  };
  const lt1Target = Math.max(2.0, base + 0.5);
  return { pts, base, lt1: at(lt1Target), lt2: at(4.0), nor: [at(2.0), at(3.5)] };
}

// Розкладка днів: Q — якісне, E — легке, R — відновлювальне, L — довга

};

function phaseSplit(weeks, tk) {
  const taper = tk === 'm' && weeks >= 12 ? 3 : weeks >= 10 ? 2 : 1;
  const R = weeks - taper;
  const spec = Math.max(1, Math.round(R * 0.35));
  const build = Math.max(1, Math.round(R * 0.35));
  const base = Math.max(0, R - spec - build);
  return [...Array(base).fill('base'), ...Array(build).fill('build'), ...Array(spec).fill('spec'), ...Array(taper).fill('taper')];
}

// Якісне тренування: q(назва, повтори, {dist|dur}, темп, відпочинок, зона, extra)
function Q(title, reps, len, pace, rest, zone, extra = {}) {
  return Object.assign({ title, reps: Math.max(1, Math.round(reps)), pace, rest, zone }, len, extra);
}
const lerp = (a, b, f) => a + (b - a) * f;

function qualityFor(method, phase, f, P, which) {

      spec: [Q('Поріг · 1000 м', 10, { dist: 1000 }, [r.hm, r['15k']], '1 хв', 4, { lact: '2,5–3,0' }), isLong ? Q('Поріг · 10 хв', 3, { dur: 10 }, [r.hm + 3, r.hm - 2], '1 хв', 4, { lact: '2,5–3,0' }) : Q('Поріг · 6 хв', 6, { dur: 6 }, [r['15k'], r['10k']], '1 хв', 4, { lact: '3,0–3,5' }), Q('Поріг · 400 м', lerp(20, 25, f), { dist: 400 }, [r['10k'] + 2, r['10k'] - 3], '30 с', 4, { lact: '≈3,5' })],

      build: [Q('4 × 8 хв', 4, { dur: 8 }, [P.t, r['10k']], '2 хв', 4), Q('5 × 4 хв', 5, { dur: 4 }, P.i, '2–3 хв', 5)],
      spec: isLong
        ? [Q('3 × 12 хв', 3, { dur: 12 }, [P.t + 5, P.t], '2 хв', 4), Q('Цільовий темп', 2, { dur: 20 }, rp, '3 хв', 3)]
        : [Q('4 × 8 хв', 4, { dur: 8 }, [P.t, r['10k']], '2 хв', 4), Q('5 × 4 хв', 5, { dur: 4 }, P.i, '2–3 хв', 5)],

  return (M[method][phase] || [])[which] || null;
}

// ---------- ЛАКТАТ ----------
function lactChart(A) {
  const pts = A.pts; if (pts.length < 2) return '';
  const W = 340, H = 210, l = 34, r = 34, t = 14, b = 30;
  const sp = pts.map(p => 1000 / p.pace), s0 = Math.min(...sp), s1 = Math.max(...sp);
  const la1 = Math.max(6, Math.ceil(Math.max(...pts.map(p => p.la))));
  const hrs = pts.map(p => p.hr).filter(Boolean); const h0 = Math.floor((Math.min(...hrs) - 5) / 10) * 10, h1 = Math.ceil((Math.max(...hrs) + 5) / 10) * 10;
  const X = (s) => l + (s - s0) / (s1 - s0 || 1) * (W - l - r);
  const Y = (v) => t + (1 - v / la1) * (H - t - b);
  const YH = (v) => t + (1 - (v - h0) / (h1 - h0 || 1)) * (H - t - b);
  let g = '';
  for (let v = 0; v <= la1; v += 2) g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v}</text>`;
  if (A.nor[0] && A.nor[1]) g += `<rect x="${X(1000 / A.nor[0].pace)}" y="${t}" width="${X(1000 / A.nor[1].pace) - X(1000 / A.nor[0].pace)}" height="${H - t - b}" class="band"/>`;
  [2, 4].forEach(v => g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" class="ref"/>`);
  const hrLine = hrs.length === pts.length ? `<polyline points="${pts.map(p => `${X(1000 / p.pace)},${YH(p.hr)}`).join(' ')}" class="hrl"/>` + `<text x="${W - r + 6}" y="${YH(h1) + 4}" class="ax">${h1}</text><text x="${W - r + 6}" y="${YH(h0)}" class="ax">${h0}</text>` : '';
  const laLine = `<polyline points="${pts.map(p => `${X(1000 / p.pace)},${Y(p.la)}`).join(' ')}" class="lal"/>` + pts.map(p => `<circle cx="${X(1000 / p.pace)}" cy="${Y(p.la)}" r="3.5" class="dot"/>`).join('');
  const xl = pts.map(p => `<text x="${X(1000 / p.pace)}" y="${H - 10}" text-anchor="middle" class="ax">${fp(p.pace)}</text>`).join('');
  const mk = (pt, lab) => pt ? `<line x1="${X(1000 / pt.pace)}" x2="${X(1000 / pt.pace)}" y1="${t}" y2="${H - b}" class="mk"/><text x="${X(1000 / pt.pace) + 4}" y="${t + 10}" class="mkl">${lab}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Лактатна крива">${g}${hrLine}${laLine}${mk(A.lt1, 'LT1')}${mk(A.lt2, 'LT2')}${xl}
    <text x="${l - 6}" y="${t - 4}" text-anchor="end" class="ax">ммоль</text><text x="${W - r + 6}" y="${t - 4}" class="ax">пульс</text></svg>
    <div class="legend"><span><i class="lg la"></i>лактат</span><span><i class="lg hr"></i>пульс</span><span><i class="lg bd"></i>норвезьке вікно 2–3,5</span></div>`;
}

// ---------- ПЛАН ----------
const PLAN_NAMES = { daniels: 'Деніелс', norway: 'Норвезька', pfitz: 'Пфітцінгер', canova: 'Канова', hudson: 'Хадсон', seiler: '80/20' };
const MONTHS = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
const dShort = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
function planDates(weeks, raceDate) {
  if (!raceDate) return null;
  const rd = new Date(raceDate + 'T12:00:00');
  if (isNaN(rd)) return null;
  const raceDow = (rd.getDay() + 6) % 7;
  const monRace = new Date(rd); monRace.setDate(rd.getDate() - raceDow);
  const start = new Date(monRace); start.setDate(monRace.getDate() - (weeks - 1) * 7);
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const cur = Math.floor((today - start) / 86400000 / 7);
  return { start, raceDow, cur, rd };
}
function planSig() { const p = S.plan; return [S.target, p.method, p.weeks, p.days, p.raceDate].join('|'); }
function planChart(pl, cur) {
  const W = 340, H = 120, b = 18, t = 8, n = pl.weeks.length, gap = n > 12 ? 3 : 5;
  const bw = (W - gap * (n - 1)) / n, mx = Math.max(...pl.weeks.map(w => w.km));
  const zc = { base: 'z2', build: 'z3', spec: 'z4', taper: 'z5' };
  return `<svg class="pchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Обсяг по тижнях">${pl.weeks.map((w, i) => {
    const h = (w.km / mx) * (H - b - t), x = i * (bw + gap), y = H - b - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" class="pb ${zc[w.phase]}${i === cur ? ' cur' : ''}"/>` + (n <= 12 || i % 2 === 0 ? `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" class="ax">${w.n}</text>` : '');
  }).join('')}</svg>`;
}
function viewPlan() {
  const seg = chips([['plan', 'План підготовки'], ['long', 'Довгі й легкі']], S.planView, 'pview', 'seg');
  if (S.planView === 'long') return `${seg}${viewLong()}`;
  const P = buildPaces(S);
  if (!P) return seg + emptyPB();
  const o = S.plan;
  const dates = planDates(o.weeks, o.raceDate);
  const pl = buildPlan(P, { weeks: o.weeks, days: o.days, method: o.method, weeklyKm: S.weeklyKm, raceDow: dates ? dates.raceDow : 6 });
  const sig = planSig();
  const done = S.planDone[sig] || {};
  const cur = dates ? dates.cur : -1;
  const warn = [...pl.warnings];
  if (dates && cur > 0 && cur < o.weeks) warn.unshift(`До старту ${o.weeks - cur} тиж. — план уже йде, зараз тиждень ${cur + 1}.`);
  if (dates && cur >= o.weeks) warn.unshift('Дата старту вже минула. Оберіть нову дату.');
  const phaseLegend = Object.keys(PHASES).filter(k => pl.weeks.some(w => w.phase === k)).map(k => {
    const ws = pl.weeks.filter(w => w.phase === k);
    return `<div class="ph"><i class="${{ base: 'z2', build: 'z3', spec: 'z4', taper: 'z5' }[k]}"></i><b>${PHASES[k].name}</b><span>${ws.length} тиж. · ${PHASES[k].about}</span></div>`;
  }).join('');
  const doneCount = Object.values(done).filter(Boolean).length;
  const totalRuns = pl.weeks.reduce((s, w) => s + w.days.filter(d => d.type !== 'rest').length, 0);
  const openW = cur >= 0 && cur < o.weeks ? cur : 0;
  const week = (w, i) => {
    let range = '';
    if (dates) { const s = new Date(dates.start); s.setDate(s.getDate() + i * 7); const e = new Date(s); e.setDate(s.getDate() + 6); range = `${dShort(s)} – ${dShort(e)}`; }
    const runs = w.days.filter(d => d.type !== 'rest');
    const wd = runs.filter(d => done[`${w.n}-${d.d}`]).length;
    return `<details class="card wk${i === cur ? ' now' : ''}"${i === openW ? ' open' : ''}>
      <summary><div><h3>Тиждень ${w.n}${i === cur ? ' · зараз' : ''}</h3><p class="sub">${PHASES[w.phase].name}${w.recovery ? ' · розвантажувальний' : ''}${range ? ' · ' + range : ''}</p></div>
      <div class="wkm"><b>${Math.round(w.km)}</b><span>км · ${wd}/${runs.length}</span></div></summary>
      <div class="days">${w.days.map(d => {
        if (d.type === 'rest') return `<div class="day rest"><span class="dw">${DOW[d.d]}</span><div class="dt"><b>${d.title}</b></div></div>`;
        const key = `${w.n}-${d.d}`, isDone = !!done[key];
        const tags = [d.lact ? `лактат ${d.lact}` : '', d.pct ? d.pct : '', d.rest && d.rest !== '—' ? `відп. ${d.rest}` : ''].filter(Boolean);
        return `<div class="day${isDone ? ' done' : ''}${d.type === 'race' ? ' race' : ''}">
          <span class="dw">${DOW[d.d]}</span>
          <div class="dt"><b>${d.struct ? `<em>${d.struct}</em> ` : ''}${esc(d.title)}</b>
            <span>${d.pace != null ? pr(d.pace) + ' /км · ' : ''}≈${Math.round(d.km)} км${tags.length ? ' · ' + tags.join(' · ') : ''}</span>
            ${d.note ? `<span class="dn">${esc(d.note)}</span>` : ''}</div>
          ${zpill(d.zone || 2)}
          <button type="button" class="chk${isDone ? ' on' : ''}" data-act="pdone" data-v="${key}" aria-label="Позначити як виконане" aria-pressed="${isDone}"></button>
        </div>`;
      }).join('')}</div></details>`;
  };
  return `${seg}${exampleNote()}
  <section class="card"><h3>Налаштування плану</h3>
    <div class="lbl">Старт</div>${chips(DKEYS.map(k => [k, DIST[k].short]), S.target, 'target', 'scroll')}
    <div class="lbl">Методика</div>${chips(PLAN_METHODS.map(m => [m, PLAN_NAMES[m]]), o.method, 'pmethod', 'scroll')}
    <div class="lbl">Тривалість, тижнів</div>${chips(PLAN_WEEKS.map(w => [w, w]), o.weeks, 'pweeks', 'seg')}
    <div class="lbl">Пробіжок на тиждень</div>${chips([3, 4, 5, 6, 7].map(d => [d, d]), o.days, 'pdays', 'seg')}
    <div class="grid2">${field('Зараз, км/тиждень', 'weeklyKm', S.weeklyKm)}
      <label class="fld" for="f_race"><span>Дата старту</span><input id="f_race" type="date" data-k="plan.raceDate" value="${esc(o.raceDate)}"></label></div>
  </section>
  <section class="hero plan">
    ${track(360, 200, 9, 7)}
    <div class="hero-in">
      <p class="eyebrow">${o.weeks} тижнів · ${PLAN_NAMES[o.method]}</p>
      <div class="big sm">${DIST[S.target].name}<small>${fmtTime(P.rp * DIST[S.target].km)}</small></div>
      <div class="stats">
        <div><span>Темп старту</span><b>${fp(P.rp)}</b></div>
        <div><span>Пік, км/тижд</span><b>${Math.round(pl.peak)}</b></div>
        <div><span>Найдовша</span><b>${Math.round(pl.longest)} км</b></div>
        <div><span>Виконано</span><b>${doneCount}/${totalRuns}</b></div>
      </div>
    </div>
  </section>
  ${warn.length ? `<div class="note">${warn.map(esc).join('<br>')}</div>` : ''}
  <section class="card"><h3>Обсяг по тижнях</h3>${planChart(pl, cur)}<div class="phs">${phaseLegend}</div></section>
  ${pl.weeks.map(week).join('')}
  <p class="foot">Це орієнтовний план за методикою, а не персональний план тренера. Слухайте тіло: при болю, хворобі чи поганому сні замінюйте якісне тренування легким. Розминка 15–20 хв і заминка 10 хв уже враховані в кілометрах.</p>`;
}

async function stravaRefresh() {
  if (!TG || !API || SV.busy) return;
  SV.busy = true; rerenderProfile();
  try {
    const j = await api('/api/strava/status');
    SV.connected = j.connected; SV.athlete = j.athlete; SV.error = null;
  } catch (e) { SV.error = e.message || 'Не вдалося зв’язатися із сервером.'; }
  SV.busy = false; SV.checked = true; rerenderProfile();
  if (SV.connected && (!S.strava || Date.now() - S.strava.at > 12 * 3600e3)) stravaSync('year');
}
// кандидати на рекорди: найшвидші пробіжки, довші за дистанцію, і всі старти (Race)
function candidates(pool) {
  const ids = new Set();
  const N = { '5k': 5, '10k': 4, 'hm': 3, 'm': 2 };
  for (const k in SKM) pool.filter(r => r.km >= SKM[k] * 0.98).sort((x, y) => x.sec / x.km - y.sec / y.km).slice(0, N[k]).forEach(r => ids.add(r.id));
  pool.filter(r => r.race && r.km >= 4.9).sort((x, y) => x.sec / x.km - y.sec / y.km).slice(0, 15).forEach(r => ids.add(r.id));
  return [...ids];
}
function bestsFrom(ids, runsById) {
  const b = {};
  for (const id of ids) {
    const x = EFF[id]; if (!x || !x.efforts) continue;
    for (const k in x.efforts) {
      if (!SKM[k]) continue;
      const sec = x.efforts[k];
      if (!b[k] || sec < b[k].sec) b[k] = { sec, date: x.date, name: x.name };
    }
  }
  return b;
}
async function stravaSync(scope) {
  if (!TG || !API || SV.busy) return;
  SV.busy = true; SV.error = null; SV.progress = 'Завантажую пробіжки…'; rerenderProfile();
  try {
    const yearAgo = Date.now() - 365 * 86400e3;
    const runs = [];
    for (let page = 1; page <= (scope === 'all' ? 25 : 3); page++) {
      const j = await api('/api/strava/list', { page });
      if (!j.connected) { SV.connected = false; throw new Error('Strava відключено. Підключіть знову.'); }
      SV.athlete = j.athlete || SV.athlete;
      runs.push(...j.runs);
      SV.progress = `Завантажено пробіжок: ${runs.length}…`; rerenderProfile();
      if (!j.more) break;
      if (scope !== 'all' && j.lastDate && Date.parse(j.lastDate) < yearAgo) break;
    }
    runs.sort((x, y) => String(y.date).localeCompare(String(x.date)));
    const yearRuns = runs.filter(r => Date.parse(r.date) >= yearAgo);
    const since = Date.now() - 28 * 86400e3;
    const weeklyKm = runs.filter(r => Date.parse(r.date) > since).reduce((s, r) => s + r.km, 0) / 4;
    const hrs = yearRuns.map(r => r.maxHr).filter(Boolean);
    const yIds = candidates(yearRuns), aIds = scope === 'all' ? candidates(runs) : [];
    const need = [...new Set([...yIds, ...aIds])].filter(id => !EFF[id]);
    for (let i = 0; i < need.length; i += 5) {
      SV.progress = `Шукаю рекорди у пробіжках: ${Math.min(i + 5, need.length)} з ${need.length}…`; rerenderProfile();
      const j = await api('/api/strava/efforts', { ids: need.slice(i, i + 5) });
      Object.assign(EFF, j.results || {});
      if (j.error) { SV.error = j.error; break; }
    }
    const prev = S.strava || {};
    S.strava = {
      at: Date.now(), weeklyKm, maxHr: hrs.length ? Math.max(...hrs) : null,
      runs: runs.slice(0, 20).map(r => ({ name: r.name, date: r.date, km: r.km, sec: r.sec, avgHr: r.avgHr })),
      bestsYear: bestsFrom(yIds), checkedYear: yIds.length, found: runs.length,
      bestsAll: scope === 'all' ? bestsFrom(aIds) : (prev.bestsAll || null), allAt: scope === 'all' ? Date.now() : (prev.allAt || null), checkedAll: scope === 'all' ? aIds.length : prev.checkedAll,
    };
    save();
  } catch (e) { SV.error = e.message || 'Помилка синхронізації.'; }
  SV.busy = false; SV.progress = ''; rerenderProfile();
}
function stravaCard() {
  const head = '<section class="card"><h3>Strava</h3>';
  if (!TG) return `${head}<p class="sub">Strava підключається в Telegram-боті <b>@zone5crew_bot</b>: відкрийте Zone 5 там.</p></section>`;
  if (!API) return `${head}<p class="sub">Сервер Strava ще не налаштовано.</p></section>`;
  const err = SV.error ? `<p class="err">${esc(SV.error)}</p>` : '';
  if (!SV.checked && SV.busy) return `${head}<p class="sub">Перевіряю підключення…</p></section>`;
  if (!SV.connected) return `${head}<p class="sub">Підтягніть найкращі результати, тижневий обсяг, ЧСС макс і останні пробіжки.</p>
    <button type="button" class="btn" data-act="sconnect" ${SV.busy ? 'disabled' : ''}>Підключити Strava</button>
    ${SV.waiting ? '<p class="sub">Після дозволу у Strava поверніться сюди — дані підтягнуться самі.</p>' : ''}${err}</section>`;
  const D = S.strava;
  const upd = D ? new Date(D.at) : null;
  const pick = S.stravaPick || 'year';
  let h = `${head}<div class="integ"><div><b>${esc(SV.athlete || 'Підключено')}</b><span>${SV.busy ? esc(SV.progress || 'Синхронізую…') : upd ? `Оновлено ${pad(upd.getDate())}.${pad(upd.getMonth() + 1)} о ${upd.getHours()}:${pad(upd.getMinutes())} · пробіжок: ${D.found}` : 'Ще не синхронізовано'}</span></div><span class="soon on">STRAVA</span></div>`;
  if (D) {
    const cell = (b) => b ? `<b>${fmtTime(b.sec)}</b><em>${pad(new Date(b.date).getDate())}.${pad(new Date(b.date).getMonth() + 1)}.${String(new Date(b.date).getFullYear()).slice(2)}</em>` : '<span class="mut">—</span>';
    h += `<div class="tbl"><div class="tr th s4"><span>Дистанція</span><span>За рік</span><span>Весь час</span><span>Профіль</span></div>${['5k', '10k', 'hm', 'm'].map(k => `<div class="tr s4"><span>${DIST[k].name}</span><span class="bc">${cell(D.bestsYear && D.bestsYear[k])}</span><span class="bc">${D.bestsAll ? cell(D.bestsAll[k]) : '<span class="mut">?</span>'}</span><span class="mut">${esc(S.pbs[k]) || '—'}</span></div>`).join('')}</div>`;
    if (!D.bestsAll) h += `<p class="sub">«Весь час» ще не шукали. Натисніть «Рекорди за весь час» нижче.</p>`;
    h += `<div class="grid2"><div class="out"><span>Обсяг, 4 тижні</span><b>${Math.round(D.weeklyKm || 0)}<small>км/тижд</small></b></div><div class="out"><span>ЧСС макс за рік</span><b>${D.maxHr ? Math.round(D.maxHr) : '—'}<small>уд/хв</small></b></div></div>`;
    h += `<div class="lbl">Що внести в профіль</div>${chips([['year', 'Рекорди за рік'], ['all', 'Рекорди за весь час']], pick, 'spick', 'seg')}
      <button type="button" class="btn" data-act="sapply" ${SV.busy || (pick === 'all' && !D.bestsAll) ? 'disabled' : ''}>Внести в профіль</button>
      <p class="sub">Результати в профілі замінюються значеннями зі Strava. Для тренувальних темпів краще брати рекорди за рік — вони показують поточну форму. ЧСС макс оновлюється, лише якщо вища.</p>`;
    if (D.runs && D.runs.length) {
      const Z = hrZones(S);
      const zoneOf = (hr) => { if (!hr || !Z) return null; for (let i = Z.zones.length - 1; i >= 0; i--) if (hr >= Z.zones[i].lo) return i + 1; return 1; };
      h += `<div class="lbl">Останні пробіжки</div><div class="runs">${D.runs.slice(0, 8).map(r => { const dt = new Date(r.date), z = zoneOf(r.avgHr); return `<div class="run"><div><b>${esc(r.name)}</b><span>${pad(dt.getDate())}.${pad(dt.getMonth() + 1)} · ${r.km.toFixed(1)} км · ${fp(r.sec / r.km)} /км${r.avgHr ? ' · ' + Math.round(r.avgHr) + ' уд/хв' : ''}</span></div>${z ? zpill(z) : ''}</div>`; }).join('')}</div>`;
    }
  }
  h += `<div class="row"><button type="button" class="btn ghost" data-act="ssync" ${SV.busy ? 'disabled' : ''}>Синхронізувати</button><button type="button" class="btn ghost" data-act="sall" ${SV.busy ? 'disabled' : ''}>Рекорди за весь час</button></div>
    <button type="button" class="btn ghost" data-act="soff" ${SV.busy ? 'disabled' : ''}>Відключити Strava</button>${err}</section>`;
  return h;
}

const VIEWS = { pace: viewPace, intervals: viewIntervals, plan: viewPlan, zones: viewZones, lactate: viewLactate, profile: viewProfile };
function render(keepScroll) {
  document.documentElement.dataset.theme = S.theme;
  const y = window.scrollY;
  document.getElementById('view').innerHTML = VIEWS[tab]();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.getElementById('ttl').textContent = TABS.find(t => t.id === tab).label;
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
function go(t) { tab = t; if (t === 'profile' && TG && API && !SV.checked) stravaRefresh(); try { history.replaceState(null, '', '#' + t); } catch (e) { location.hash = t; } render(); }

document.addEventListener('change', (e) => {
  const k = e.target.dataset.k; if (!k) return;
  let v = e.target.value.trim();
  const numeric = /^(age|hrMax|hrRest|lthr|lt1Hr|lt2Hr|weeklyKm)$|manualZones|\.hr$/.test(k);
  if (numeric) v = v === '' ? null : Number(v.replace(',', '.'));
  getSet(k, v);
  if (!k.startsWith('pc.')) S.example = false;
  if (k === 'pc.dist' || k === 'pc.time' || k === 'pc.pace') { /* ok */ }
  save(); render(true);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-act],[data-tab]')) haptic();
  const tb = e.target.closest('[data-tab]');
  if (tb) { e.preventDefault(); go(tb.dataset.tab); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const v = a.dataset.v, act = a.dataset.act;
  const msg = (t) => { const m = document.getElementById('msg'); if (m) m.textContent = t; };
  switch (act) {
    case 'pcmode': {
      // переносимо поточний результат у поле, яке звільняється
      const c = S.pc, d = Number(String(c.dist).replace(',', '.')), t = parseTime(c.time), p = parseTime(c.pace);
      if (c.mode === 'pace' && d > 0 && t > 0) c.pace = fmtPace(t / d);
      if (c.mode === 'time' && d > 0 && p > 0) c.time = fmtTime(p * d);
      if (c.mode === 'dist' && t > 0 && p > 0) c.dist = (t / p).toFixed(2);
      c.mode = v; break;
    }
    case 'pcdist': S.pc.dist = v; break;
    case 'target': S.target = v; S.targetTime = ''; S.example = false; break;
    case 'method': S.method = v; break;
    case 'zmethod': S.zoneMethod = v; break;
    case 'theme': S.theme = v; break;
    case 'pview': S.planView = v; break;
    case 'pmethod': S.plan.method = v; break;
    case 'pweeks': S.plan.weeks = Number(v); break;
    case 'pdays': S.plan.days = Number(v); break;
    case 'pdone': { const sg = planSig(); const m = S.planDone[sg] = S.planDone[sg] || {}; m[v] = !m[v]; if (!m[v]) delete m[v]; try { m[v] && TG && TG.HapticFeedback.notificationOccurred('success'); } catch (er) { } break; }
    case 'sconnect':
      api('/api/strava/start').then(j => { SV.waiting = true; rerenderProfile(); try { TG.openLink(j.url); } catch (er) { location.href = j.url; } }).catch(er => { SV.error = er.message; rerenderProfile(); });
      return;
    case 'ssync': stravaSync('year'); return;
    case 'sall': stravaSync('all'); return;
    case 'spick': S.stravaPick = v; break;
    case 'soff':
      if (a.dataset.confirm !== '1') { a.dataset.confirm = '1'; a.textContent = 'Точно відключити?'; return; }
      SV.busy = true; rerenderProfile();
      api('/api/strava/disconnect').then(() => { SV.connected = false; SV.athlete = null; S.strava = null; save(); }).catch(er => { SV.error = er.message; }).finally(() => { SV.busy = false; rerenderProfile(); });
      return;
    case 'sapply': {
      const D = S.strava; if (!D) return;
      const B = (S.stravaPick || 'year') === 'all' ? D.bestsAll : D.bestsYear;
      if (!B) return;
      for (const k of ['5k', '10k', 'hm', 'm']) if (B[k]) S.pbs[k] = fmtTime(B[k].sec);
      if (D.weeklyKm > 0) S.weeklyKm = Math.round(D.weeklyKm);
      if (D.maxHr && (!S.hrMax || D.maxHr > S.hrMax)) S.hrMax = Math.round(D.maxHr);
      S.example = false;
      try { TG.HapticFeedback.notificationOccurred('success'); } catch (er) { }
      break;
    }
    case 'lradd': S.lactRows.push({ pace: '', hr: '', la: '' }); S.example = false; break;
    case 'lrdel': S.lactRows.splice(Number(v), 1); break;
    case 'ltdel': S.lactTests.splice(Number(v), 1); break;
    case 'lapply': {
      const A = lactateAnalysis(S.lactRows);
      if (A.lt1 && A.lt2) { S.lt1Hr = A.lt1.hr; S.lt2Hr = A.lt2.hr; if (A.lt2.hr) S.lthr = A.lt2.hr; S.zoneMethod = 'lactate'; S.example = false; save(); go('zones'); return; }
      break;
    }
    case 'lsave': {
      const A = lactateAnalysis(S.lactRows);
      const d = new Date(); S.lactTests.unshift({ date: `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`, lt1: A.lt1, lt2: A.lt2, rows: structuredClone(S.lactRows) });
      break;
    }
    case 'copy':
      try { navigator.clipboard.writeText(JSON.stringify(S, null, 1)).then(() => msg('Скопійовано.'), () => msg('Не вдалося скопіювати.')); } catch (err) { msg('Не вдалося скопіювати.'); }
      return;
    case 'reset': {
      if (a.dataset.confirm !== '1') { a.dataset.confirm = '1'; a.textContent = 'Точно скинути? Натисніть ще раз'; return; }
      S = structuredClone(DEFAULT); break;
    }
  }
  save(); render(true);
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== tab) { tab = t; render(); } });
document.querySelector('.tabs').innerHTML = TABS.map(t => `<button type="button" data-tab="${t.id}"><span class="ti ti-${t.id}"></span>${t.label}</button>`).join('');
if (TG) {
  document.documentElement.classList.add('tg');
  try { TG.ready(); TG.expand(); TG.setHeaderColor('#0a0a0b'); TG.setBackgroundColor('#0a0a0b'); TG.setBottomBarColor && TG.setBottomBarColor('#0a0a0b'); } catch (e) { }
  try { TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (e) { }
  const u = TG.initDataUnsafe && TG.initDataUnsafe.user;
  if (u && !S.name) S.name = [u.first_name, u.last_name].filter(Boolean).join(' ');
}
render();
cloudLoad();
if (TG && API) {
  stravaRefresh();
  const back = async () => {
    if (!SV.waiting || document.visibilityState !== 'visible') return;
    SV.checked = false;
    await stravaRefresh();
    if (SV.connected) { SV.waiting = false; S.strava = null; stravaSync('year'); }
  };
  document.addEventListener('visibilitychange', back);
  try { TG.onEvent('activated', back); } catch (e) { }
}
